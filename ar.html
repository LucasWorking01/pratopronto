<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ver na mesa — protótipo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ar.css" />
</head>
<body class="ar-body">

  <div class="ar-stage" id="arStage">
    <video class="ar-video" id="arVideo" playsinline autoplay muted></video>

    <img
      class="ar-sticker"
      id="arSticker"
      src="assets/prato-executivo.jpg"
      alt="Prato executivo sobreposto ao vídeo da câmera"
      draggable="false"
    />

    <div class="ar-permission" id="arPermission" hidden>
      <p class="ar-permission__text" id="arPermissionText">
        Precisamos da câmera para mostrar o prato sobre a mesa.
      </p>
      <button class="ar-permission__btn" id="arRetry">Permitir câmera</button>
    </div>
  </div>

  <div class="ar-controls">
    <a class="ar-controls__back" href="index.html" aria-label="Voltar ao cardápio">← Voltar</a>

    <label class="ar-controls__size">
      Tamanho
      <input type="range" id="arScale" min="40" max="180" value="90" />
    </label>
  </div>

  <p class="ar-note">
    Isto não é AR de verdade: é a foto do prato sobreposta ao vídeo da câmera.
    Arraste para posicionar e use o controle para redimensionar.
  </p>

  <script src="js/ar.js"></script>
</body>
</html>
