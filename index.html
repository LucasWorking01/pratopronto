<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio ao vivo — protótipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <p class="site-header__kicker">Prato feito</p>
    <h1 class="site-header__title">Toque no prato para ver o que chega na mesa</h1>
    <p class="site-header__sub">Protótipo — a foto abaixo é o prato real do dia, exibido no momento do pedido.</p>
  </header>

  <main class="menu">
    <button class="dish-card" id="dishCard" aria-expanded="false" aria-controls="preview">
      <span class="dish-card__name">Prato executivo do dia</span>
      <span class="dish-card__desc">Bife na chapa, ovo frito, linguiça, feijão tropeiro, couve e arroz</span>
      <span class="dish-card__cta">Pedir</span>
    </button>

    <section class="preview" id="preview" hidden>
      <div class="preview__frame">
        <div class="preview__scan" aria-hidden="true"></div>
        <img class="preview__img" src="assets/prato-executivo.jpg" alt="Prato executivo com bife, ovo frito, linguiça, feijão tropeiro, couve e arroz" />
      </div>
      <p class="preview__status" id="previewStatus">Preparando visualização…</p>
      <a class="preview__ar-link" href="ar.html">Ver na mesa (câmera)</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>Versão 0.1 — imagem fixa (catálogo). Sem geração de IA nem modelagem 3D nesta etapa.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
